---
- name: Check Disk Utilization on RHEL 9.4
  hosts: web-server
  gather_facts: no
 
  vars:
    disk_threshold: 80   # Percentage
 
  tasks:
    - name: Get disk usage
      command: df -hP
      register: disk_usage
      changed_when: false
 
    - name: Display disk usage
      debug:
        msg: "{{ disk_usage.stdout_lines }}"
 
    - name: Check disk utilization against threshold
      shell: |
        df -hP | awk 'NR>1 {gsub("%","",$5); if ($5 > {{ disk_threshold }}) print $0}'
      register: disk_exceeded
      changed_when: false
 
    - name: Show warning if disk usage exceeded
      debug:
        msg: |
          ⚠️ Disk usage exceeded {{ disk_threshold }}%:
          {{ disk_exceeded.stdout_lines }}
      when: disk_exceeded.stdout != ""
 
    - name: Fail if disk usage exceeded threshold
      fail:
        msg: "❌ Disk usage exceeded {{ disk_threshold }}% on one or more filesystems"
      when: disk_exceeded.stdout != ""
