---
- name: System Health Check (CPU, Memory, Disk) - RHEL 9.4
  hosts: localhost
  become: true
  gather_facts: no
 
  vars:
    cpu_threshold: 80      
    memory_threshold: 80   
    disk_threshold: 80     
 
  tasks:
    - name: Get CPU idle percentage
      shell: |
        top -bn1 | grep "Cpu(s)" | awk '{print $8}' | cut -d. -f1
      register: cpu_idle
      changed_when: false
 
    - name: Calculate CPU usage
      set_fact:
        cpu_usage: "{{ 100 - cpu_idle.stdout | int }}"
 
    - name: Show CPU utilization
      debug:
        msg: " CPU Utilization: {{ cpu_usage }}%"
 
    - name: Get memory usage percentage
      shell: |
        free | awk '/Mem:/ {printf "%.0f", $3/$2 * 100}'
      register: memory_usage
      changed_when: false
 
    - name: Show memory utilization
      debug:
        msg: " Memory Utilization: {{ memory_usage.stdout }}%"
 
    - name: Get disk utilization exceeding threshold
      shell: |
        df -hP -x tmpfs -x devtmpfs | awk 'NR>1 {gsub("%","",$5); if ($5 > {{ disk_threshold }}) print $0}'
      register: disk_exceeded
      changed_when: false
 
    - name: Show disk utilization warnings
      debug:
        msg: |
          📀 Disk utilization exceeded {{ disk_threshold }}%:
          {{ disk_exceeded.stdout_lines }}
      when: disk_exceeded.stdout != ""
 
 
    - name: Fail if CPU utilization exceeded
      fail:
        msg: " CPU utilization exceeded {{ cpu_threshold }}% (Current: {{ cpu_usage }}%)"
      when: cpu_usage | int > cpu_threshold
 
    - name: Fail if Memory utilization exceeded
      fail:
        msg: " Memory utilization exceeded {{ memory_threshold }}% (Current: {{ memory_usage.stdout }}%)"
      when: memory_usage.stdout | int > memory_threshold
 
    - name: Fail if Disk utilization exceeded
      fail:
        msg: " Disk utilization exceeded {{ disk_threshold }}%"
      when: disk_exceeded.stdout != ""
 
 
    - name: System health check passed
      debug:
        msg: "✅ System health check passed: CPU, Memory, and Disk are within limits"
