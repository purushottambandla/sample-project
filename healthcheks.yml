---
- name: RHEL 9.4 VM Health Check
  hosts: all
  become: yes
  become_user: root
  gather_facts: yes
 
  tasks:
 
    - name: Display OS version
      debug:
        msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
 
    - name: Display system uptime
      command: uptime
      register: uptime_output
 
    - name: Show uptime
      debug:
        msg: "{{ uptime_output.stdout }}"
 
    - name: Check CPU load
      shell: cat /proc/loadavg
      register: cpu_load
 
    - name: Show CPU load
      debug:
        msg: "CPU Load Average: {{ cpu_load.stdout }}"
 
    - name: Check memory usage
      command: free -h
      register: memory_output
 
    - name: Show memory usage
      debug:
        msg: "{{ memory_output.stdout_lines }}"
 
    - name: Check disk usage
      command: df -h
      register: disk_output
 
    - name: Show disk usage
      debug:
        msg: "{{ disk_output.stdout_lines }}"
 
    - name: Check SSH service status
      systemd:
        name: sshd
        state: started
      register: ssh_status
 
    - name: Check firewalld service status
      systemd:
        name: firewalld
        state: started
      register: firewall_status
 
    - name: Ping gateway to check network
      command: ping -c 3 8.8.8.8
      register: ping_result
      ignore_errors: yes
 
    - name: Show network status
      debug:
        msg: >
          Network is {{
          'reachable' if ping_result.rc == 0 else 'NOT reachable'
          }}
 
