---
- name: System Health Check (CPU | Memory | Disk) - RHEL 9.4
  hosts: web-server
  become: true
  gather_facts: no
 
  vars:
    cpu_threshold: 80
    memory_threshold: 80
    disk_threshold: 80
 
  tasks:
 
    #################################################
    # CPU UTILIZATION
    #################################################
    - name: Get CPU idle percentage
      shell: |
        top -bn1 | awk -F',' '/Cpu\(s\)/ {print 100 - $4}'
      register: cpu_usage
      changed_when: false
 
    #################################################
    # MEMORY UTILIZATION
    #################################################
    - name: Get memory usage percentage
      shell: |
        free | awk '/Mem:/ {printf "%.0f", $3/$2 * 100}'
      register: mem_usage
      changed_when: false
 
    #################################################
    # DISK UTILIZATION
    #################################################
    - name: Get disk usage per filesystem
      shell: |
        df -hP -x tmpfs -x devtmpfs | awk 'NR>1 {print $6 ": " $5}'
      register: disk_usage
      changed_when: false
 
    - name: Check disk usage exceeding threshold
      shell: |
        df -hP -x tmpfs -x devtmpfs | awk 'NR>1 {gsub("%","",$5); if ($5 > {{ disk_threshold }}) print $6 " (" $5 "%)"}'
      register: disk_alert
      changed_when: false
 
    #################################################
    # NEAT OUTPUT
    #################################################
    - name: Display System Health Summary
      debug:
        msg: |
          ==========================================
          🖥️  SYSTEM HEALTH CHECK - {{ inventory_hostname }}
          ==========================================
 
          🔹 CPU Utilization    : {{ cpu_usage.stdout | int }}%
          🔹 Memory Utilization : {{ mem_usage.stdout | int }}%
 
          🔹 Disk Utilization:
          {% for line in disk_usage.stdout_lines %}
            - {{ line }}
          {% endfor %}
 
          {% if disk_alert.stdout != "" %}
          ⚠️ Disk Threshold Exceeded (> {{ disk_threshold }}%):
          {% for line in disk_alert.stdout_lines %}
            - {{ line }}
          {% endfor %}
          {% else %}
          ✅ Disk usage within threshold
          {% endif %}
 
          ==========================================
    #################################################
    # FAIL CONDITIONS
    #################################################
    - name: Fail if CPU utilization exceeded
      fail:
        msg: "❌ CPU utilization exceeded {{ cpu_threshold }}%"
      when: cpu_usage.stdout | int > cpu_threshold
 
    - name: Fail if Memory utilization exceeded
      fail:
        msg: "❌ Memory utilization exceeded {{ memory_threshold }}%"
      when: mem_usage.stdout | int > memory_threshold
 
    - name: Fail if Disk utilization exceeded
      fail:
        msg: "❌ Disk utilization exceeded {{ disk_threshold }}%"
      when: disk_alert.stdout != ""
